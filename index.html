<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Situation Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <div class="bg-slate-900 text-white p-6 shadow-lg">
        <div class="max-w-7xl mx-auto">
            <h1 class="text-4xl font-bold mb-1">Situation Monitor</h1>
            <p class="text-slate-400 text-sm">Real-time pulse on politics, markets & breaking news · <span id="lastUpdated">Loading...</span></p>
        </div>
    </div>

    <div class="bg-white border-b border-gray-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <div class="flex items-center gap-3 mb-2">
                <svg class="w-5 h-5 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
                </svg>
                <h2 class="font-bold text-sm uppercase text-gray-700 tracking-wide">Trending Now</h2>
                <button onclick="loadData()" class="ml-auto text-xs bg-slate-100 hover:bg-slate-200 px-3 py-1 rounded-full text-slate-600 font-medium transition">
                    Refresh ↻
                </button>
                <button id="clearFilter" onclick="clearFilter()" style="display:none;" class="text-xs bg-red-100 hover:bg-red-200 px-3 py-1 rounded-full text-red-600 font-medium transition">
                    Clear Filter ✕
                </button>
            </div>
            <div id="trendingTerms" class="flex gap-3 overflow-x-auto pb-2 scrollbar-hide">
                <p class="text-gray-500 text-sm">Loading...</p>
            </div>
        </div>
    </div>

    <div class="bg-slate-800 text-white">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <div class="flex items-center gap-3">
                <span class="text-xl">📊</span>
                <h2 class="font-bold text-sm uppercase tracking-wide">Market Movers</h2>
                <span class="ml-auto text-xs text-gray-300">Coming Soon - Yahoo Finance Integration</span>
            </div>
        </div>
    </div>

    <div class="max-w-7xl mx-auto p-6">
        <div class="mb-4">
            <h2 class="text-2xl font-bold text-gray-900">
                <span id="sectionTitle">Key Situations</span>
            </h2>
            <p class="text-gray-500 text-sm"><span id="situationCount">Loading...</span> developments</p>
        </div>
        
        <div id="situationCards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            <p class="text-gray-500">Loading news...</p>
        </div>
    </div>

    <script>
        var allArticles = [];
        var allKeywords = [];
        var selectedTerm = null;

        function clearFilter() {
            selectedTerm = null;
            document.getElementById('clearFilter').style.display = 'none';
            document.getElementById('sectionTitle').textContent = 'Key Situations';
            renderArticles(allArticles);
            renderTrending(allKeywords);
        }

        function selectTerm(term) {
            if (selectedTerm === term) {
                clearFilter();
                return;
            }
            
            selectedTerm = term;
            document.getElementById('clearFilter').style.display = 'inline-block';
            document.getElementById('sectionTitle').textContent = 'Situations mentioning "' + term + '"';
            
            var filtered = allArticles.filter(function(article) {
                return article.title.toLowerCase().includes(term.toLowerCase()) ||
                       article.description.toLowerCase().includes(term.toLowerCase());
            });
            
            renderArticles(filtered);
            renderTrending(allKeywords);
            
            document.getElementById('situationCount').textContent = filtered.length;
        }

        function renderTrending(keywords) {
            var html = keywords.map(function(kw) {
                var word = kw[0];
                var count = kw[1];
                var isSelected = selectedTerm === word;
                var ringClass = isSelected ? 'ring-2 ring-blue-500 bg-blue-50' : '';
                var fire = count > 3 ? '<span class="text-red-500 text-xs">🔥</span>' : '';
                
                return '<div onclick="selectTerm(\'' + word + '\')" class="flex-shrink-0 bg-slate-50 border border-slate-200 rounded-lg px-4 py-2 hover:shadow-md hover:border-blue-400 transition-all cursor-pointer ' + ringClass + '">' +
                    '<div class="flex items-center gap-2">' +
                        '<span class="font-bold text-gray-900">' + word.charAt(0).toUpperCase() + word.slice(1) + '</span>' +
                        fire +
                    '</div>' +
                    '<p class="text-xs text-gray-500 mt-1">' + count + ' mentions</p>' +
                '</div>';
            }).join('');
            
            document.getElementById('trendingTerms').innerHTML = html || '<p class="text-gray-500 text-sm">No trending topics</p>';
        }

        function renderArticles(articles) {
            var badges = { 
                politics: 'bg-indigo-50 text-indigo-700', 
                markets: 'bg-slate-100 text-slate-700', 
                breaking: 'bg-rose-600 text-white' 
            };
            var icons = { politics: '🏛️', markets: '📈', breaking: '⚡' };
            
            if (articles.length === 0) {
                document.getElementById('situationCards').innerHTML = 
                    '<div class="col-span-full bg-yellow-50 border border-yellow-200 rounded-lg p-6">' +
                        '<p class="text-yellow-800 font-semibold">No articles found for "' + selectedTerm + '"</p>' +
                        '<p class="text-yellow-600 text-sm mt-2">Try selecting a different trending term or clear the filter.</p>' +
                    '</div>';
                return;
            }
            
            var html = articles.map(function(article) {
                var badge = badges[article.category];
                var icon = icons[article.category];
                var label = article.category === 'breaking' ? '⚡ BREAKING' : 
                           article.category === 'markets' ? '📈 Markets' : '🏛️ Politics';
                var desc = article.description + (article.description.length >= 150 ? '...' : '');
                
                return '<div class="bg-white rounded-xl shadow-md border border-gray-200 p-6 hover:shadow-xl hover:scale-[1.02] transition-all duration-200 cursor-pointer group">' +
                    '<div class="flex items-start justify-between mb-4">' +
                        '<span class="text-3xl">' + icon + '</span>' +
                        '<span class="text-xs px-3 py-1 rounded-full font-semibold ' + badge + '">' + label + '</span>' +
                    '</div>' +
                    '<h3 class="font-bold text-lg mb-3 leading-tight text-gray-900 group-hover:text-blue-600 transition-colors">' +
                        article.title +
                    '</h3>' +
                    '<p class="text-gray-600 text-sm mb-2 leading-relaxed">' + desc + '</p>' +
                    '<p class="text-gray-900 text-sm font-semibold mb-4 leading-relaxed">' +
                        article.source +
                    '</p>' +
                    '<div class="flex items-center justify-between text-xs text-gray-400 pt-4 border-t border-gray-100">' +
                        '<span>' + article.source + ' · ' + article.timeAgo + '</span>' +
                        '<a href="' + article.url + '" target="_blank" class="text-blue-600 hover:text-blue-700 font-medium group-hover:underline">' +
                            'Read more →' +
                        '</a>' +
                    '</div>' +
                '</div>';
            }).join('');
            
            document.getElementById('situationCards').innerHTML = html;
        }

        function loadData() {
            document.getElementById('lastUpdated').textContent = 'Updating...';
            
            fetch('/api/news')
                .then(function(response) { return response.json(); })
                .then(function(data) {
                    if (!data.articles || data.articles.length === 0) {
                        throw new Error('No articles found');
                    }
                    
                    allArticles = data.articles;
                    allKeywords = data.keywords || [];
                    
                    renderTrending(allKeywords);
                    
                    if (selectedTerm) {
                        selectTerm(selectedTerm);
                    } else {
                        renderArticles(allArticles);
                        document.getElementById('situationCount').textContent = allArticles.length;
                    }
                    
                    document.getElementById('lastUpdated').textContent = new Date().toLocaleTimeString();
                })
                .catch(function(error) {
                    console.error('Error:', error);
                    document.getElementById('situationCards').innerHTML = 
                        '<div class="col-span-full bg-red-50 border border-red-200 rounded-lg p-6">' +
                            '<p class="text-red-800 font-semibold">Error loading news</p>' +
                            '<p class="text-red-600 text-sm mt-2">' + error.message + '</p>' +
                            '<button onclick="loadData()" class="mt-4 bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">Try Again</button>' +
                        '</div>';
                });
        }
        
        loadData();
        setInterval(loadData, 900000);
    </script>
</body>
</html>
