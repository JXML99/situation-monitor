<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Situation Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background: linear-gradient(to bottom right, #0f172a, #1e1b4b, #0f172a);
            min-height: 100vh;
        }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glow {
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
        }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .card-enter {
            animation: slideIn 0.3s ease-out;
        }
        .gradient-text {
            background: linear-gradient(to right, #a78bfa, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body class="text-white">
    
    <!-- Header -->
    <div class="sticky top-0 z-50 glass border-b border-white/10">
        <div class="max-w-6xl mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center text-xl">
                        🌐
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold gradient-text">Situation Monitor</h1>
                        <p class="text-xs text-gray-400">What's happening right now</p>
                    </div>
                </div>
                <button onclick="loadAll()" class="glass px-4 py-2 rounded-full text-sm font-medium hover:bg-white/10 transition flex items-center gap-2">
                    <span>↻</span>
                    <span class="hidden sm:inline">Refresh</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Trending Tags -->
    <div class="max-w-6xl mx-auto px-4 py-6">
        <div class="flex items-center gap-2 mb-3">
            <span class="text-sm font-semibold text-purple-400">🔥 TRENDING</span>
            <button id="clearFilter" onclick="clearFilter()" style="display:none;" class="text-xs bg-red-500/20 hover:bg-red-500/30 px-3 py-1 rounded-full text-red-300 transition">
                Clear ✕
            </button>
        </div>
        <div id="trendingTerms" class="flex gap-2 overflow-x-auto pb-3 scrollbar-hide">
            <div class="glass px-4 py-2 rounded-full text-sm animate-pulse">Loading...</div>
        </div>
    </div>

    <!-- Market Ticker -->
    <div class="max-w-6xl mx-auto px-4 pb-6">
        <div class="glass rounded-2xl p-4 glow">
            <div class="flex items-center gap-2 mb-3">
                <span class="text-sm font-semibold text-green-400">📈 MARKETS</span>
                <span class="text-xs text-gray-400" id="stocksUpdated">Loading...</span>
            </div>
            <div id="stocksRibbon" class="flex gap-3 overflow-x-auto scrollbar-hide">
                <div class="glass px-4 py-3 rounded-xl min-w-[100px] animate-pulse">
                    <div class="h-4 bg-white/10 rounded mb-2"></div>
                    <div class="h-3 bg-white/5 rounded"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Feed -->
    <div class="max-w-6xl mx-auto px-4 pb-8">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-xl font-bold" id="sectionTitle">
                <span class="gradient-text">Your Feed</span>
            </h2>
            <span class="text-sm text-gray-400"><span id="situationCount">0</span> posts</span>
        </div>
        
        <div id="situationCards" class="space-y-4">
            <!-- Loading skeleton -->
            <div class="glass rounded-2xl p-6 animate-pulse">
                <div class="h-6 bg-white/10 rounded mb-3 w-3/4"></div>
                <div class="h-4 bg-white/5 rounded mb-2"></div>
                <div class="h-4 bg-white/5 rounded w-1/2"></div>
            </div>
        </div>
    </div>

    <script>
        var allArticles = [];
        var allKeywords = [];
        var selectedTerm = null;

        function clearFilter() {
            selectedTerm = null;
            document.getElementById('clearFilter').style.display = 'none';
            document.getElementById('sectionTitle').innerHTML = '<span class="gradient-text">Your Feed</span>';
            renderArticles(allArticles);
            renderTrending(allKeywords);
        }

        function selectTerm(term) {
            if (selectedTerm === term) {
                clearFilter();
                return;
            }
            
            selectedTerm = term;
            document.getElementById('clearFilter').style.display = 'inline-block';
            document.getElementById('sectionTitle').innerHTML = '<span class="gradient-text">#' + term + '</span>';
            
            var filtered = allArticles.filter(function(article) {
                return article.title.toLowerCase().includes(term.toLowerCase()) ||
                       article.description.toLowerCase().includes(term.toLowerCase());
            });
            
            renderArticles(filtered);
            renderTrending(allKeywords);
            document.getElementById('situationCount').textContent = filtered.length;
        }

        function renderTrending(keywords) {
            var html = keywords.map(function(kw) {
                var word = kw[0];
                var count = kw[1];
                var isSelected = selectedTerm === word;
                var selectedClass = isSelected ? 'bg-purple-500/30 border-purple-400' : 'glass hover:bg-white/10';
                
                return '<button onclick="selectTerm(\'' + word + '\')" class="' + selectedClass + ' px-4 py-2 rounded-full text-sm font-medium transition border border-white/10 whitespace-nowrap">' +
                    '#' + word +
                    '<span class="ml-1 text-xs opacity-60">' + count + '</span>' +
                '</button>';
            }).join('');
            
            document.getElementById('trendingTerms').innerHTML = html || '<div class="text-sm text-gray-400">No trends yet</div>';
        }

        function renderArticles(articles) {
            if (articles.length === 0) {
                document.getElementById('situationCards').innerHTML = 
                    '<div class="glass rounded-2xl p-8 text-center">' +
                        '<div class="text-4xl mb-3">🔍</div>' +
                        '<p class="text-gray-300 font-semibold">No posts found for #' + selectedTerm + '</p>' +
                        '<p class="text-gray-500 text-sm mt-2">Try a different tag or clear the filter</p>' +
                    '</div>';
                return;
            }
            
            var html = articles.map(function(article, index) {
                var categoryColors = {
                    politics: { bg: 'bg-blue-500/20', text: 'text-blue-300', emoji: '🏛️' },
                    markets: { bg: 'bg-green-500/20', text: 'text-green-300', emoji: '📈' },
                    breaking: { bg: 'bg-red-500/20', text: 'text-red-300', emoji: '⚡' }
                };
                var cat = categoryColors[article.category];
                
                return '<div class="glass rounded-2xl p-6 hover:bg-white/10 transition card-enter" style="animation-delay: ' + (index * 0.05) + 's">' +
                    '<div class="flex items-start gap-3 mb-4">' +
                        '<div class="w-12 h-12 rounded-full ' + cat.bg + ' flex items-center justify-center text-2xl flex-shrink-0">' +
                            cat.emoji +
                        '</div>' +
                        '<div class="flex-1 min-w-0">' +
                            '<div class="flex items-center gap-2 mb-1">' +
                                '<span class="font-bold text-gray-200">' + article.source + '</span>' +
                                '<span class="text-xs text-gray-500">·</span>' +
                                '<span class="text-xs text-gray-500">' + article.timeAgo + '</span>' +
                            '</div>' +
                            '<span class="text-xs px-2 py-1 rounded-full ' + cat.bg + ' ' + cat.text + ' font-medium">' +
                                article.category.toUpperCase() +
                            '</span>' +
                        '</div>' +
                    '</div>' +
                    
                    '<h3 class="text-lg font-bold text-white mb-2 leading-snug hover:text-purple-300 transition cursor-pointer">' +
                        article.title +
                    '</h3>' +
                    
                    '<p class="text-gray-400 text-sm mb-4 leading-relaxed">' +
                        article.description.substring(0, 150) + (article.description.length > 150 ? '...' : '') +
                    '</p>' +
                    
                    '<div class="flex items-center justify-between pt-4 border-t border-white/10">' +
                        '<div class="flex items-center gap-3 text-xs text-gray-500">' +
                            '<button class="hover:text-purple-400 transition flex items-center gap-1">' +
                                '<span>💬</span><span>Share</span>' +
                            '</button>' +
                            '<button class="hover:text-purple-400 transition flex items-center gap-1">' +
                                '<span>🔖</span><span>Save</span>' +
                            '</button>' +
                        '</div>' +
                        '<a href="' + article.url + '" target="_blank" class="text-purple-400 hover:text-purple-300 text-sm font-medium flex items-center gap-1 transition">' +
                            'Read more <span>→</span>' +
                        '</a>' +
                    '</div>' +
                '</div>';
            }).join('');
            
            document.getElementById('situationCards').innerHTML = html;
        }

        function renderStocks(stocks) {
            if (!stocks || stocks.length === 0) {
                document.getElementById('stocksRibbon').innerHTML = 
                    '<div class="text-sm text-gray-400">No data</div>';
                return;
            }
            
            var html = stocks.map(function(stock) {
                var isUp = stock.direction === 'up';
                var colorClass = isUp ? 'text-green-400' : 'text-red-400';
                var bgClass = isUp ? 'bg-green-500/10' : 'bg-red-500/10';
                var arrow = isUp ? '↑' : '↓';
                var sign = isUp ? '+' : '';
                
                return '<div class="glass ' + bgClass + ' rounded-xl px-4 py-3 min-w-[110px] hover:scale-105 transition cursor-pointer">' +
                    '<div class="flex items-center justify-between mb-1">' +
                        '<span class="font-bold text-white">' + stock.ticker + '</span>' +
                        '<span class="text-lg">' + arrow + '</span>' +
                    '</div>' +
                    '<div class="text-sm text-gray-300 mb-1">$' + stock.price + '</div>' +
                    '<div class="text-xs font-bold ' + colorClass + '">' +
                        sign + stock.changePercent + '%' +
                    '</div>' +
                '</div>';
            }).join('');
            
            document.getElementById('stocksRibbon').innerHTML = html;
            document.getElementById('stocksUpdated').textContent = 'Live · 15min delay';
        }

        function loadData() {
            fetch('/api/news')
                .then(function(response) { return response.json(); })
                .then(function(data) {
                    if (!data.articles || data.articles.length === 0) {
                        throw new Error('No articles found');
                    }
                    
                    allArticles = data.articles;
                    allKeywords = data.keywords || [];
                    
                    renderTrending(allKeywords);
                    
                    if (selectedTerm) {
                        selectTerm(selectedTerm);
                    } else {
                        renderArticles(allArticles);
                        document.getElementById('situationCount').textContent = allArticles.length;
                    }
                })
                .catch(function(error) {
                    console.error('Error:', error);
                    document.getElementById('situationCards').innerHTML = 
                        '<div class="glass rounded-2xl p-8 text-center">' +
                            '<div class="text-4xl mb-3">⚠️</div>' +
                            '<p class="text-red-300 font-semibold">Error loading feed</p>' +
                            '<p class="text-gray-400 text-sm mt-2">' + error.message + '</p>' +
                            '<button onclick="loadData()" class="mt-4 bg-purple-500 hover:bg-purple-600 px-6 py-2 rounded-full font-medium transition">Try Again</button>' +
                        '</div>';
                });
        }

        function loadStocks() {
            fetch('/api/stocks')
                .then(function(response) { return response.json(); })
                .then(function(data) {
                    if (data.stocks) {
                        renderStocks(data.stocks);
                    }
                })
                .catch(function(error) {
                    console.error('Stocks error:', error);
                    document.getElementById('stocksRibbon').innerHTML = 
                        '<div class="text-sm text-red-400">Error loading</div>';
                });
        }

        function loadAll() {
            loadData();
            loadStocks();
        }
        
        // Initial load
        loadAll();
        
        // Auto-refresh
        setInterval(loadData, 900000); // News every 15min
        setInterval(loadStocks, 300000); // Stocks every 5min
    </script>
</body>
</html>
