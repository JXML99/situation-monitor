<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Situation Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">
    <div class="bg-slate-900 text-white p-6 shadow-lg">
        <div class="max-w-7xl mx-auto">
            <h1 class="text-4xl font-bold mb-1">Situation Monitor</h1>
            <p class="text-slate-400 text-sm">Real-time pulse · <span id="lastUpdated">Loading...</span></p>
        </div>
    </div>

    <div class="bg-white border-b border-gray-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <div class="flex items-center gap-3 mb-2">
                <h2 class="font-bold text-sm uppercase text-gray-700">Trending Now</h2>
                <button onclick="loadData()" class="ml-auto text-xs bg-slate-100 px-3 py-1 rounded-full">Refresh</button>
            </div>
            <div id="trendingTerms" class="flex gap-3 overflow-x-auto pb-2"></div>
        </div>
    </div>

    <div class="bg-slate-800 text-white">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <span class="text-xl">📊</span>
            <span class="font-bold text-sm ml-3">Market Movers - Coming Soon</span>
        </div>
    </div>

    <div class="max-w-7xl mx-auto p-6">
        <h2 class="text-2xl font-bold mb-4">Key Situations</h2>
        <div id="situationCards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
    </div>

    <script>
        async function loadData() {
            try {
                const response = await fetch('/api/news');
                const data = await response.json();
                
                const trendingHTML = (data.keywords || []).map(([word, count]) => `
                    <div class="bg-slate-50 border rounded-lg px-4 py-2">
                        <span class="font-bold">${word}</span>
                        <p class="text-xs text-gray-500">${count} mentions</p>
                    </div>
                `).join('');
                document.getElementById('trendingTerms').innerHTML = trendingHTML;
                
                const cardsHTML = (data.articles || []).map(article => {
                    const badges = { politics: 'bg-indigo-50 text-indigo-700', markets: 'bg-slate-100 text-slate-700', breaking: 'bg-rose-600 text-white' };
                    const icons = { politics: '🏛️', markets: '📈', breaking: '⚡' };
                    
                    return `
                        <div class="bg-white rounded-xl shadow-md border p-6 hover:shadow-xl transition-all">
                            <div class="flex justify-between mb-4">
                                <span class="text-3xl">${icons[article.category]}</span>
                                <span class="text-xs px-3 py-1 rounded-full ${badges[article.category]}">${article.category.toUpperCase()}</span>
                            </div>
                            <h3 class="font-bold text-lg mb-3">${article.title}</h3>
                            <p class="text-gray-600 text-sm mb-2">${article.description}</p>
                            <p class="text-gray-900 text-sm font-semibold mb-4">${article.source}</p>
                            <div class="flex justify-between text-xs pt-4 border-t">
                                <span class="text-gray-400">${article.timeAgo}</span>
                                <a href="${article.url}" target="_blank" class="text-blue-600 hover:underline">Read more →</a>
                            </div>
                        </div>
                    `;
                }).join('');
                
                document.getElementById('situationCards').innerHTML = cardsHTML;
                document.getElementById('lastUpdated').textContent = new Date().toLocaleTimeString();
            } catch (error) {
                document.getElementById('situationCards').innerHTML = `<div class="col-span-full bg-red-50 p-6 rounded"><p class="text-red-800">Error: ${error.message}</p></div>`;
            }
        }
        loadData();
        setInterval(loadData, 900000);
    </script>
</body>
</html>
